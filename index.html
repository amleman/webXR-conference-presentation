<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#04070f" />
    <meta
      name="description"
      content="WebXR + Agentes de IA: destronando la complejidad del desarrollo VR tradicional. Presentación WebXR nativa de Anthony Alemán."
    />
    <title>WebXR + Agentes de IA · Anthony Alemán</title>
    <link rel="icon" href="data:," />

    <!-- Tipografías: display tecnológica, texto, y monoespaciada para el mockup de consola -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind Play CDN: observa el DOM, así que las clases que inyecta Deck2D funcionan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Paleta y tipografías del deck expuestas como utilidades Tailwind.
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Orbitron', 'system-ui', 'sans-serif'],
              body: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
          },
        },
      };
    </script>

    <style>
      /* ------------------------------------------------------------------
         Estilos base del deck 2D.
         Deliberadamente autosuficientes: si el CDN de Tailwind estuviera
         bloqueado, la presentación sigue siendo legible y con identidad.
         ------------------------------------------------------------------ */
      :root {
        --void: #04070f;
        --cyan: #22d3ee;
        --magenta: #e879f9;
        --amber: #fbbf24;
        --ink: #e6f6ff;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--void);
        color: var(--ink);
        font-family: Inter, system-ui, sans-serif;
        overscroll-behavior: none;
      }

      /* El canvas WebGL vive detrás del deck 2D toda la sesión:
         nunca se destruye, sólo se descubre al entrar en VR. */
      #scene-container {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #scene-container canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
      }

      /* Capa 2D. `hidden` la retira por completo mientras la sesión XR presenta. */
      #deck-2d {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #deck-2d[hidden] {
        display: none !important;
      }

      /* Fondo opaco: sostiene el "esto es un sitio web normal" hasta la slide 5. */
      .deck-backdrop {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(
            ellipse 90% 60% at 50% 8%,
            rgba(34, 211, 238, 0.16),
            transparent 60%
          ),
          radial-gradient(
            ellipse 70% 50% at 85% 95%,
            rgba(232, 121, 249, 0.12),
            transparent 60%
          ),
          linear-gradient(180deg, #060b18 0%, #04070f 55%, #02040a 100%);
      }
      /* Rejilla en perspectiva: el eco 2D del suelo cyber del entorno 3D. */
      .deck-backdrop::after {
        content: '';
        position: absolute;
        inset: 45% 0 0 0;
        background-image:
          linear-gradient(rgba(34, 211, 238, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(34, 211, 238, 0.18) 1px, transparent 1px);
        background-size: 56px 56px;
        transform: perspective(320px) rotateX(62deg);
        transform-origin: top center;
        mask-image: linear-gradient(180deg, transparent, #000 35%, transparent);
        -webkit-mask-image: linear-gradient(
          180deg,
          transparent,
          #000 35%,
          transparent
        );
        opacity: 0.55;
        pointer-events: none;
      }

      .font-display {
        font-family: Orbitron, system-ui, sans-serif;
        letter-spacing: 0.01em;
      }
      .font-mono,
      code {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }

      /* Transición de entrada de cada slide. */
      .slide-enter {
        animation: slideEnter 480ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      @keyframes slideEnter {
        from {
          opacity: 0;
          transform: translate3d(0, 26px, 0);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .stagger > * {
        animation: slideEnter 520ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .stagger > *:nth-child(1) {
        animation-delay: 60ms;
      }
      .stagger > *:nth-child(2) {
        animation-delay: 130ms;
      }
      .stagger > *:nth-child(3) {
        animation-delay: 200ms;
      }
      .stagger > *:nth-child(4) {
        animation-delay: 270ms;
      }

      /* Botón primario neón, usado para "Siguiente" y para el CTA de VR. */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        border-radius: 9999px;
        border: 1px solid rgba(34, 211, 238, 0.35);
        background: rgba(8, 20, 34, 0.7);
        color: var(--ink);
        padding: 0.7rem 1.35rem;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease,
          background 160ms ease;
      }
      .btn:hover:not(:disabled) {
        transform: translateY(-2px);
        border-color: rgba(34, 211, 238, 0.8);
        box-shadow: 0 0 26px rgba(34, 211, 238, 0.28);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .btn-vr {
        border-color: rgba(34, 211, 238, 0.9);
        background: linear-gradient(
          100deg,
          rgba(34, 211, 238, 0.22),
          rgba(232, 121, 249, 0.22)
        );
        box-shadow:
          0 0 30px rgba(34, 211, 238, 0.35),
          inset 0 0 22px rgba(34, 211, 238, 0.12);
      }
      /* El CTA de la slide final respira para atraer la mirada. */
      .btn-vr-hero {
        font-size: 1.05rem;
        padding: 1.05rem 2.2rem;
        letter-spacing: 0.06em;
        animation: vrPulse 2.4s ease-in-out infinite;
      }
      @keyframes vrPulse {
        0%,
        100% {
          box-shadow:
            0 0 24px rgba(34, 211, 238, 0.3),
            0 0 0 0 rgba(34, 211, 238, 0.28);
        }
        50% {
          box-shadow:
            0 0 46px rgba(34, 211, 238, 0.55),
            0 0 0 16px rgba(34, 211, 238, 0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .slide-enter,
        .stagger > *,
        .btn-vr-hero {
          animation: none !important;
        }
      }

      /* Cursor parpadeante del mockup de consola de Unity (slide 2). */
      .caret::after {
        content: '\258D';
        animation: blink 1.1s steps(1) infinite;
        color: var(--cyan);
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      /* Barra de progreso indeterminada "Building APK…". */
      .build-bar {
        position: relative;
        overflow: hidden;
      }
      .build-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 38%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(251, 191, 36, 0.85),
          transparent
        );
        animation: buildScan 1.8s linear infinite;
      }
      @keyframes buildScan {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(320%);
        }
      }
    </style>
  </head>

  <body>
    <!-- Capa 3D: el mundo IWSDK existe desde el primer frame, aunque no se vea. -->
    <div id="scene-container"></div>

    <!-- Capa 2D: Deck2D la puebla; este marcado es sólo el esqueleto. -->
    <div id="deck-2d">
      <div class="deck-backdrop"></div>
      <header
        id="deck-header"
        class="relative flex items-center justify-between px-5 py-4 sm:px-10 sm:py-6"
      ></header>
      <main
        id="slide-stage"
        class="relative flex flex-1 items-center justify-center px-5 pb-2 sm:px-10"
      ></main>
      <footer
        id="deck-footer"
        class="relative flex items-center justify-between gap-4 px-5 py-4 sm:px-10 sm:py-6"
      ></footer>
    </div>

    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
